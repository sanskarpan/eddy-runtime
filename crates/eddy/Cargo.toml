[package]
name = "eddy"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
libc = "0.2"
slab = "0.4"
parking_lot = "0.12"
pin-project-lite = "0.2"
tracing = "0.1"
crossbeam-utils = "0.8"

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
static_assertions = "1.1.0"

[[example]]
name = "spike"
path = "examples/spike.rs"

[[bench]]
name = "vs_tokio"
harness = false

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(loom)"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests + deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p eddy --all-targets -- -D warnings
      - name: Test
        run: cargo test -p eddy --all-targets
      - name: Forbid runtime deps in the main crate
        # The oracle crates (tokio, futures) must never become runtime
        # dependencies; `--edges normal` excludes dev-dependencies.
        run: |
          cargo tree -p eddy --edges normal > /tmp/runtime-deps.txt
          if grep -qE '\b(tokio|async-std|smol|mio|polling|futures-executor)\b' /tmp/runtime-deps.txt; then
            echo "forbidden runtime dependency found:"
            grep -E '\b(tokio|async-std|smol|mio|polling|futures-executor)\b' /tmp/runtime-deps.txt
            exit 1
          fi
          echo "no forbidden runtime dependencies"

  matrix:
    # Phase 0: run the suite on the other supported targets. aarch64-linux
    # runs under qemu-user (weak memory ordering exposes bugs x86 hides).
    name: tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p eddy --all-targets --target ${{ matrix.target }}

  test-aarch64-linux:
    name: tests (aarch64-unknown-linux-gnu, qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install qemu and cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu
      - name: Test under qemu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: cargo test -p eddy --all-targets --target aarch64-unknown-linux-gnu

  loom:
    # The Chase-Lev queue and injector are verified with loom; the model tests
    # only compile under `--cfg loom`, so they need a dedicated run.
    name: loom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Loom model tests
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test -p eddy --lib

  miri:
    # Stacked-borrows/UB check for the pure modules. Tests that construct a
    # runtime call foreign syscalls (kqueue/epoll) Miri cannot run, so they are
    # filtered out; the checked modules are disjoint from `runtime::tests`:
    # `time::` would match "runtime::", but `time::wheel::` does not.
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        run: 'cargo miri test -p eddy --lib -- task:: sync:: time::wheel::'
